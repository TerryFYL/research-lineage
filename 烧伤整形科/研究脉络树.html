<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>烧伤整形科研究脉络树</title>
<style>
:root {
  --paper: oklch(.977 .009 78); --paper-2: oklch(.993 .005 82); --paper-3: oklch(.955 .012 74);
  --ink: oklch(.23 .016 55); --ink-2: oklch(.44 .015 55); --ink-3: oklch(.52 .014 60);
  --rule: oklch(.88 .012 70); --rule-2: oklch(.80 .014 66);
  --accent: oklch(.58 .16 45); --accent-2: oklch(.49 .16 42); --accent-soft: oklch(.945 .04 60);
  --wood: oklch(.45 .035 62); --wood-2: oklch(.60 .03 66);
  /* 八类关系各一个色相；「质疑」另外加粗并带叉号。
     「其他写法」＝边上的原字不是八类词开头，用不带颜色的浅灰，和「并行」的蓝拉开：一个浅而灰，一个深而蓝 */
  --c-verify: oklch(.52 .12 158); --c-extend: oklch(.66 .14 66); --c-doubt: oklch(.52 .2 27); --c-revise: oklch(.5 .15 300);
  --c-split: oklch(.62 .1 205); --c-comp: oklch(.68 .13 108); --c-para: oklch(.5 .15 258); --c-same: oklch(.6 .15 345);
  --c-other: oklch(.62 .004 80);
  --cross: oklch(.46 .055 232);
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --sans: "PingFang SC", "SF Pro Text", -apple-system, "Helvetica Neue", sans-serif;
  --mono: "SF Mono", Menlo, ui-monospace, monospace;
  --expo: cubic-bezier(.16, 1, .3, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.7 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
h1, h2, h3, p { margin: 0; }
a { color: var(--accent-2); text-underline-offset: 3px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.app { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 18px 28px 12px; gap: 10px; }
.mast { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; border-bottom: 1px solid var(--rule-2); padding-bottom: 12px; }
.eyebrow { font: 10px/1.4 var(--mono); letter-spacing: .18em; color: var(--accent-2); }
h1 { font: 500 30px/1.2 var(--serif); letter-spacing: -.02em; margin-top: 4px; }
h1 span { margin-left: 14px; font-size: 15px; font-weight: 400; color: var(--ink-2); letter-spacing: 0; }
.mast-meta { font: 11px/1.6 var(--sans); color: var(--ink-2); text-align: right; }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 384px; gap: 0; min-height: 0; }
.stage { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; min-width: 0; min-height: 0; padding-right: 22px; }
.canvas-wrap { position: relative; display: grid; grid-template-rows: minmax(0, 1fr); min-width: 0; min-height: 0; }
.canvas { position: relative; min-height: 0; overflow: hidden; }
.dirstrip { display: none; }
#tree { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.mini { position: absolute; right: 26px; top: 44px; width: 150px; height: auto; z-index: 2; background: oklch(.993 .005 82 / .88); border: 1px solid var(--rule-2); border-radius: 5px; cursor: pointer; touch-action: none; }
.mwood path { fill: var(--wood); stroke: var(--wood); stroke-width: .9px; vector-effect: non-scaling-stroke; opacity: .5; }
.mwood path.cur { fill: var(--accent); stroke: var(--accent); opacity: 1; stroke-width: 1.4px; }
.mhit path { fill: transparent; }
.mview { fill: oklch(.58 .16 45 / .10); stroke: var(--accent); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
#tree.dragging { cursor: grabbing; }

.hud { position: absolute; left: 2px; top: 4px; z-index: 2; pointer-events: none; max-width: 330px; }
.year { width: fit-content; font: 500 58px/1 var(--serif); letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--ink); text-shadow: 0 0 8px var(--paper), 0 0 16px var(--paper), 0 0 2px var(--paper); }
.feed { margin-top: 10px; display: grid; gap: 6px; justify-items: start; }
.feed button { display: none; text-shadow: 0 0 6px var(--paper), 0 0 2px var(--paper); text-align: left; padding: 0; font: 13px/1.5 var(--serif); color: var(--ink); pointer-events: auto; }
.feed button.on { display: block; animation: feedin .5s var(--expo); }
.feed button:nth-child(2).on { opacity: .62; } .feed button:nth-child(3).on { opacity: .36; }
@keyframes feedin { from { opacity: 0; transform: translateY(6px); } }
.feed small { display: block; font: 10.5px/1.5 var(--mono); color: var(--accent-2); }
.feed.one { gap: 3px; } .feed.one small { display: inline; margin-right: 8px; }
.focus-cap { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); z-index: 3; display: flex; align-items: baseline; gap: 12px; max-width: 58%; padding: 4px 6px 4px 14px; background: oklch(.993 .005 82 / .9); border: 1px solid var(--rule-2); border-radius: 16px; white-space: nowrap; }
.focus-cap b { font: 500 14.5px/1.5 var(--serif); color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.focus-cap i { font: 10px var(--mono); font-style: normal; letter-spacing: .1em; color: var(--accent-2); }
.focus-cap button { font-size: 12px; color: var(--ink-2); padding: 2px 9px; border-left: 1px solid var(--rule); }
.focus-cap button:hover { color: var(--accent-2); }
.focus-cap span { font: 12px/1.6 var(--sans); color: var(--ink-2); white-space: normal; }
.tools { position: absolute; right: 26px; top: 6px; z-index: 2; display: flex; gap: 4px; }
.tools button { min-width: 34px; height: 30px; padding: 0 9px; border: 1px solid var(--rule-2); border-radius: 5px; background: var(--paper-2); font-size: 12px; color: var(--ink-2); transition: border-color .2s, color .2s; }
.tools button:hover { border-color: var(--accent); color: var(--accent-2); }
.tip { position: absolute; z-index: 5; pointer-events: none; max-width: 320px; background: var(--ink); color: var(--paper); border-radius: 5px; padding: 8px 12px; font-size: 12px; line-height: 1.55; box-shadow: 0 6px 22px oklch(.23 .016 55 / .16); }
.tip small { display: block; font: 10px/1.5 var(--mono); opacity: .7; }

/* 树 */
.arc { fill: none; stroke: var(--rule-2); stroke-width: .7; stroke-dasharray: 2 5; vector-effect: non-scaling-stroke; }
.arc.minor { stroke-dasharray: 1 7; opacity: .7; }
.arc-label text { font: 10px var(--mono); fill: var(--ink-2); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
.ground { stroke: var(--rule-2); stroke-width: 1; vector-effect: non-scaling-stroke; }
.front { fill: none; stroke: var(--ink-2); stroke-width: .9; opacity: .32; vector-effect: non-scaling-stroke; }
.wood { fill: var(--wood); stroke: var(--wood); stroke-width: 0; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: opacity .3s; }
.root { fill: var(--wood); opacity: .5; }
.tipdot { fill: var(--wood); opacity: .9; }
.wedge { fill: transparent; stroke: none; pointer-events: none; }

/* 方向内的关系线：颜色＝类别，实线/虚线照报告分支图。平时画得淡，让节点和名字在前面；
   鼠标停在节点或线上（.hv）、或点选之后（.em），有关的线才加深加粗 */
.rel { fill: none; stroke: var(--c-other); stroke-width: var(--lw, 1.3px); stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .55; transition: opacity .2s; }
.rel.dashed { stroke-dasharray: 5 4; }
.rel-hit { fill: none; stroke: transparent; stroke-width: 11px; vector-effect: non-scaling-stroke; pointer-events: stroke; cursor: pointer; }
.k-verify { stroke: var(--c-verify); } .k-extend { stroke: var(--c-extend); } .k-doubt { stroke: var(--c-doubt); } .k-revise { stroke: var(--c-revise); }
.k-split { stroke: var(--c-split); } .k-comp { stroke: var(--c-comp); } .k-para { stroke: var(--c-para); } .k-same { stroke: var(--c-same); } .k-other, .k-pending { stroke: var(--c-other); }
.rel.k-doubt { stroke-width: calc(var(--lw, 1.3px) * 1.45); opacity: .8; }
.rel.hv { opacity: 1; stroke-width: calc(var(--lw, 1.3px) * 1.6); }
.ahead { opacity: .7; transition: opacity .2s; } .ahead.hv { opacity: 1; }
.ahead path { stroke: none; }
.ahead.k-verify path { fill: var(--c-verify); } .ahead.k-extend path { fill: var(--c-extend); } .ahead.k-doubt path { fill: var(--c-doubt); } .ahead.k-revise path { fill: var(--c-revise); }
.ahead.k-split path { fill: var(--c-split); } .ahead.k-comp path { fill: var(--c-comp); } .ahead.k-para path { fill: var(--c-para); } .ahead.k-same path { fill: var(--c-same); }
.ahead.k-other path, .ahead.k-pending path { fill: var(--c-other); } .ahead.x path { fill: var(--cross); }
.mark circle { fill: var(--paper-2); stroke-width: 1.1; }
.mark path { fill: none; stroke-width: 1.5; stroke-linecap: round; }
.mark text { font: 600 8px var(--sans); text-anchor: middle; }
.mark.k-doubt circle, .mark.k-doubt path { stroke: var(--c-doubt); }
.mark.k-pending circle { stroke: var(--c-other); } .mark.k-pending text { fill: var(--ink-2); }
.elabel { pointer-events: none; opacity: 0; transition: opacity .25s; }
.elabel text { font: 500 11px var(--sans); text-anchor: middle; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4.5px; stroke-linejoin: round; }

/* 方向之间的关系线：一种颜色；实线＝原文或综述明确，虚线＝章节推断 */
.xrel { fill: none; stroke: var(--cross); stroke-width: 1.1px; vector-effect: non-scaling-stroke; opacity: .42; stroke-linecap: round; transition: opacity .25s; }
.xrel.dashed { stroke-dasharray: 4 4; }
.xrel-hit { fill: none; stroke: transparent; stroke-width: 10px; vector-effect: non-scaling-stroke; pointer-events: stroke; cursor: pointer; }
.xdot { fill: var(--cross); opacity: .7; transition: opacity .25s; }

.node { cursor: pointer; outline: none; }
.node .hit { fill: transparent; }
.node .dot { fill: var(--ink); stroke: var(--paper); stroke-width: 1.3; transition: transform .5s var(--spring), opacity .3s; transform-box: fill-box; transform-origin: center; transform: scale(.01); opacity: 0; }
.node.on .dot { transform: scale(1); opacity: 1; }
.node.hollow .dot { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.7; }
.node.noev .dot { fill: var(--paper-2); stroke: var(--ink-3); stroke-width: 1.3; stroke-dasharray: 2 1.6; }
.node.lead .dot { stroke-dasharray: 2.4 1.8; }
.node .ring { fill: none; stroke: var(--accent); stroke-width: 1.3; opacity: 0; transform-box: fill-box; transform-origin: center; }
.node.sel .ring, .node:focus-visible .ring { opacity: 1; }
.node.pulse .ring { animation: pulse 1.1s var(--expo) 1; }
@keyframes pulse { 0% { opacity: .9; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.6); } }
.lbl { pointer-events: none; opacity: 0; transition: opacity .4s var(--expo); }
.lbl.on.show { opacity: 1; }
/* 被左上角的提示盖住的名字、播放途中压住别的字的小枝名：马上收起（不淡出），让开以后再淡入 */
.lbl.cov, .twig-label.cov { opacity: 0 !important; transition: none !important; }
.lbl text { font: 13px var(--serif); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 5.5px; stroke-linejoin: round; }
.lbl .yr { font: 11px var(--mono); fill: var(--ink-2); }
.lbl .ll { stroke: var(--ink-3); stroke-width: .8; }
.lbl.minor text { fill: var(--ink-2); }
.dir-label { opacity: 0; transition: opacity .6s var(--expo); pointer-events: none; outline: none; }
.dir-label.on { opacity: 1; pointer-events: auto; cursor: pointer; }
.dir-label .lhit { fill: transparent; stroke: none; }
.dir-label:hover .nm, .dir-label.hov .nm, .dir-label.cur .nm, .dir-label:focus-visible .nm { fill: var(--accent-2); }
.dir-label .nm { font: 500 15px var(--serif); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.dir-label .nm.code { font: 600 12px var(--mono); fill: var(--accent-2); letter-spacing: .04em; }
.dir-label .gp { font: 10px var(--mono); fill: var(--accent-2); letter-spacing: .1em; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
.dir-label .ct { font: 10.5px var(--sans); fill: var(--ink-2); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
.dir-lead { stroke: var(--rule-2); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }
.twig-label { pointer-events: none; opacity: 0; transition: opacity .4s; }
.twig-label text { font: 500 11.5px var(--sans); fill: var(--wood); paint-order: stroke; stroke: var(--paper); stroke-width: 4.5px; stroke-linejoin: round; }
.root-label { cursor: pointer; outline: none; }
.root-label text { font: 11px var(--sans); fill: var(--ink-2); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
.root-label:hover text, .root-label:focus-visible text { fill: var(--accent-2); }
#tree.noyr .lbl .yr { display: none; }

/* 两层看法。
   全貌：只有枝、方向名和方向之间的线。粗枝加一圈不随缩放变细的描边，小枝用细线。
   点开一枝：这一枝转到横向展开，只显示它的节点、小枝名和关系线；别的枝收起 */
#tree.overview .node, #tree.overview .lbl, #tree.overview .rel, #tree.overview .rel-hit, #tree.overview .ahead:not(.x), #tree.overview .mark, #tree.overview .elabel, #tree.overview .twig-label { opacity: 0 !important; pointer-events: none !important; }
#tree.overview .wood.stem { stroke-width: 3.3px; }
#tree.overview .wood.twig { stroke-width: .7px; opacity: .78; }
#tree.overview .wedge { pointer-events: all; cursor: pointer; }
#tree.overview .wood.hov { fill: var(--accent-2); stroke: var(--accent-2); opacity: 1; }
#tree.noxl .xrel, #tree.noxl .xrel-hit, #tree.noxl .xdot, #tree.noxl .ahead.x { display: none; }
#tree.xfocus .xrel:not(.hl), #tree.xfocus .xdot:not(.hl), #tree.xfocus .ahead.x:not(.hl) { opacity: .1; }
#tree.xfocus .xrel.hl { opacity: 1; stroke-width: 1.9px; }
#tree.xfocus .xdot.hl, #tree.xfocus .ahead.x.hl { opacity: 1; }
#tree.xfocus .wood:not(.hl) { opacity: .28; }
#tree.xfocus .dir-label.on:not(.hl) { opacity: .3; }

#tree.focus .wood:not(.hl), #tree.focus .root, #tree.focus .ground, #tree.focus .root-label { opacity: 0; pointer-events: none; }
#tree.focus .node:not(.hl), #tree.focus .lbl:not(.hl), #tree.focus .rel:not(.hl), #tree.focus .ahead:not(.hl), #tree.focus .mark:not(.hl), #tree.focus .twig-label:not(.hl) { opacity: 0 !important; pointer-events: none !important; }
#tree.focus .rel-hit:not(.hl) { pointer-events: none; }
#tree.focus .xrel, #tree.focus .xrel-hit, #tree.focus .xdot, #tree.focus .ahead.x, #tree.focus .dir-label { opacity: 0 !important; pointer-events: none !important; }
#tree.focus .dir-lead { display: none; }
#tree.focus .twig-label.hl.on { opacity: 1; }
#tree.focus .wood.hl { opacity: .36; }
/* 在点开的一枝里再点节点、线或某一类关系：有关的保持原样，其余变淡 */
#tree.sub .node.hl:not(.em), #tree.sub .rel.hl:not(.em):not(.hv), #tree.sub .ahead.hl:not(.em):not(.hv), #tree.sub .mark.hl:not(.em) { opacity: .16 !important; }
#tree.sub .lbl.hl.on.show:not(.em) { opacity: .22; }
#tree.sub .rel.em { stroke-width: calc(var(--lw, 1.3px) * 1.7); opacity: 1; }
#tree.sub .ahead.em { opacity: 1; }
#tree.sub .elabel.em.fit { opacity: 1; }
#tree.moving .lbl, #tree.moving .twig-label, #tree.moving .elabel, #tree.moving .arc-label, #tree.moving .mark, #tree.moving .dir-label, #tree.moving .dir-lead { opacity: 0 !important; transition: none; }
.canvas.overview .mini { opacity: 0; pointer-events: none; }
/* 点开一枝后小枝名写在右边，小地图挪到左下角，免得挡住 */
.canvas.focus .mini { top: auto; right: auto; left: 2px; bottom: 6px; }

/* 播放条 */
.transport { display: flex; align-items: center; gap: 12px; padding: 10px 0 8px; border-top: 1px solid var(--rule); }
.play { width: 62px; height: 40px; border: 1px solid var(--accent); border-radius: 20px; background: var(--accent-soft); color: var(--accent-2); font-size: 13px; transition: transform .2s var(--expo), background .2s; }
.play:hover { background: oklch(.92 .06 58); } .play:active { transform: scale(.96); }
.step { font-size: 12px; color: var(--ink-2); padding: 8px 4px; white-space: nowrap; } .step:hover { color: var(--accent-2); }
.scrub { flex: 1; min-width: 80px; }
input[type=range] { width: 100%; display: block; accent-color: var(--accent); height: 24px; cursor: ew-resize; }
.scrub-cap { display: flex; justify-content: space-between; font: 10.5px/1.2 var(--mono); color: var(--ink-2); }
.scrub-cap span:nth-child(2) { font-family: var(--sans); }
.speed, .toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.speed select { border: 0; background: transparent; padding: 2px; }
.toggle input { accent-color: var(--accent); }

.legend { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px 18px; padding: 8px 0 2px; border-top: 1px solid var(--rule); font-size: 11px; line-height: 1.6; color: var(--ink-2); }
.legend .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; }
.legend .grp > b { font-weight: 500; color: var(--ink); margin-right: 4px; }
.legend .it { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend svg { flex: none; }
.legend button.it { font-size: 11px; color: var(--ink-2); padding: 1px 7px 1px 4px; border-radius: 10px; border: 1px solid transparent; }
.legend button.it:hover { border-color: var(--rule-2); }
.legend button.it[aria-pressed=true] { border-color: var(--accent); color: var(--accent-2); background: var(--accent-soft); }
.legend button.it small { font: 10.5px var(--mono); color: var(--ink-2); }
.legend button.it.zero { opacity: .42; cursor: default; }
.legend button.it.zero:hover { border-color: transparent; }
.legend .it.wide { white-space: normal; }
.legend .it.note { color: var(--ink-3); }
.legend .it svg { flex: none; }
.sw-line { fill: none; stroke-width: 2; stroke-linecap: round; }

.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 12px; overflow: hidden; }
.seg button { font-size: 11px; line-height: 1.6; padding: 2px 11px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule-2); }
.seg button:hover { color: var(--accent-2); }
.seg button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent-2); }

/* 右栏 */
.panel { border-left: 1px solid var(--rule); padding: 4px 6px 24px 24px; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
.panel .kicker { font: 10px/1.5 var(--mono); letter-spacing: .14em; color: var(--accent-2); }
.panel h2 { font: 500 21px/1.42 var(--serif); letter-spacing: -.01em; margin: 8px 0 6px; text-wrap: balance; }
.panel h3 { font: 500 13px/1.5 var(--sans); color: var(--ink); margin: 20px 0 8px; padding-top: 14px; border-top: 1px solid var(--rule); }
.panel p { font: 14px/1.85 var(--serif); color: var(--ink); text-wrap: pretty; }
.panel p + p { margin-top: 8px; }
.panel .muted { color: var(--ink-2); font-size: 13px; }
.panel .when { font: 12px/1.6 var(--mono); color: var(--ink-2); }
.panel .quote { font: 13.5px/1.85 var(--serif); color: var(--ink); padding-left: 12px; border-left: 2px solid var(--rule-2); margin: 8px 0; text-wrap: pretty; }
.panel .quote + .srcnote, .srcnote { font: 11.5px/1.6 var(--sans); color: var(--ink-2); margin-top: 2px; }
.panel .quote b { font: 500 12px/1.6 var(--sans); color: var(--accent-2); }
.panel .lg { display: grid; gap: 8px; font: 12px/1.6 var(--sans); color: var(--ink-2); }
.panel .lg .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 12px; }
.panel .lg .grp > b { font-weight: 500; color: var(--ink); min-width: 26px; }
.panel .lg .it { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.panel .lg .wide { white-space: normal; align-items: flex-start; }
.panel .lg .wide svg { margin-top: 5px; }
.index { list-style: none; padding: 0; margin: 2px 0 0; }
.index li { border-bottom: 1px solid var(--rule); }
.index button { display: flex; gap: 10px; width: 100%; padding: 5px 0; font: 13.5px/1.55 var(--serif); color: var(--ink); text-align: left; }
.index button:hover { color: var(--accent-2); }
.index .yr { font: 11px/2 var(--mono); color: var(--ink-3); flex: 0 0 38px; }
.index .sh { flex: none; width: 12px; display: inline-flex; align-items: center; justify-content: center; }
.subhead { font: 500 12px/1.5 var(--sans); color: var(--wood); margin: 14px 0 2px; display: flex; justify-content: space-between; gap: 8px; }
.subhead small { font: 10px var(--mono); color: var(--ink-3); }

05-N05","D05-N10","D05-N14","D05-E7","D05-N18"],"offTree":0},{"no":"2.6","title":"通气：从高频通气到小潮气量，实践并未收敛（1982–2021）","notes":[],"nodes":["D05-N08","D05-N15","D05-N23","D05-R19","D05-E5"],"offTree":0},{"no":"2.7","title":"全身中毒：CO 与氰化物哪个更致命、怎么解（1943–2026）","notes":[],"nodes":["D05-N20","D05-N09","D05-N13","D05-N17","D05-N11"],"offTree":0},{"no":"2.8","title":"气道清理与体外支持的早期证据（1987–2013）","notes":[],"nodes":["D05-N24"],"offTree":0}]},{"id":"D04","name":"烧伤感染、脓毒症与局部抗菌","short":"感染与局部抗菌","group":"E1","file":"directions/D04_烧伤感染脓毒症与局部抗菌.md","one":"这个方向研究三件事——烧伤病人身上的细菌从哪里来、怎样区分“带菌”和“侵袭性感染”、用什么局部药物和病房管理去挡住它；本轮找到的最早专题文献在 1930 年代（美国 Aldrich 1933、英国 Cruickshank 1935），1964–1968 年三种局部抗菌剂相继用于大面积烧伤，此后分成诊断、局部用药、全身预防、肠源性感染、真菌、免疫预防、病房感染控制等多条并行分支。今天它处在“重新校准定义和诊断”的阶段，至少六个核心问题没有定论（第 5 节）。","legend":"图例：实线=原文明确讨论或综述归纳的关系；虚线=本报告推断。边上写“关系类型（说明）·依据”，关系类型限验证、扩展、质疑、修正、分化、互补、并行、同一项目八类，括号里是原来的具体说法。节点为“年份 简称”。起点线索（Aldrich 1933、Cruickshank 1935 等）只到题录，未画入。","notes":"说明：原提交中“ABA 2007→Tagami 2016（并行）”一条只因“都在 2007 年后”，本章已删除，避免被读成承接关系。","solidMeans":"原文明确讨论或综述归纳的关系","dashedMeans":"本报告推断","coverage":"基本完整但有标注缺口","turnsHead":"关键转折：问题—新证据/新方法—认识变化—新问题","turns":[{"no":"2.1","title":"病房里怎样传播：从链球菌到铜绿，再到水疗设施（1948–2010）","notes":[{"k":"认识变化","q":"（扩展，原文明确讨论）","t":"伯明翰 Lowbury & Fox 1954 [D04-N02] 转向铜绿的储存库。1951-07 至 1952-06 入院的 331 例中 156 例（47%）新获得铜绿，>10% 体表面积的多数会获得、\u003c5% 的多数不会；护士手部常被污染（11/29，38%），受感染的创面是主要储存库；新引入的血清型只在一个病房内传播。同文一项按住院号奇偶交替分配的试验（≥15% 体表面积，儿童 ≥10%）：多粘菌素 E+青霉素粉组首次换药定植 16/133（12.0%），单用青霉素粉组 35/126（27.7%）（χ²=9.17，P\u003c0.01）；到后期两组分别为 88/133（66.1%）与 103/126（81.8%），差异仍显著（χ²=7.35，P\u003c0.01），但两组多数最终都被定植。作者结论是没有哪一项措施单独有效，主张多措施并用和隔间病房。局限：交替分配不是随机，终点是定植不是侵袭或死亡。"},{"k":"新问题","q":"","t":"药物和措施会不会被耐药菌绕过。同一单位 1977–78 年庆大霉素耐药铜绿高峰时 >90% 耐药，停用庆大霉素止不住暴发，只有把铜绿患者集中到一个病房才有效（Bridges 1979 BMJ，PMID 106914，L2）。"}],"nodes":["D04-N01","D04-N02","D04-N20"],"offTree":0},{"no":"2.2","title":"焦痂下的细菌：实验模型与三种局部药（1954–1977）","notes":[{"k":"认识变化——效果有多大、能不能归因","q":"","t":"Brown 2004（PMID 15187754，L2）用同一美军烧伤中心数据，比较引入磺胺米隆之前（1950–1963）与之后（1964–1968），20–50 岁、40–79% 体表面积的患者死亡率下降超过 10%，\u003c40% 或 >79% 的只有轻微影响。Brown 称两个时期“其余治疗相近”，但这是同机构历史对照，未记录的做法变化无法排除；Brown 与 Lindberg 系列来自同一机构，不是独立验证。所以这组历史对照不能把死亡下降单独归于局部药。其他章节引用的单因归因（如 Andreasen 1971、Rashid 2001 转述的伯明翰 1971 年报告）均为作者判断，见 D10、D07。Williams 2009 摘要把烧伤死亡的整体下降归于早期切痂植皮、积极复苏和抗菌治疗等多项进步共同作用（PMID 19919684；这是整体概括，不针对 1964 年前后），复苏与切痂见 D01、D02。Pruitt & McManus 1992 综述归纳：局部化疗、及时切痂和闭合使侵袭性创面感染及相关死亡下降 [D04-E03]。Cancio 2021 称局部抗菌剂的出现“可以说”是烧伤救治中最重要的单项进步——这是作者观点，不是本报告的结论 [D04-E04]。"},{"k":"新问题","q":"","t":"局部药会不会像全身药一样筛选耐药（2.3）；它们能不能代替“侵袭”的诊断（2.4）。"}],"nodes":["D04-N04","D04-N03","D04-N05","D04-N06"],"offTree":4},{"no":"2.3","title":"局部药同样筛选耐药菌（1976–1979）","notes":[{"k":"认识变化","q":"","t":"局部抗菌也有选择压力，病房可以用“停药—耐药回落”做自然实验。这与 2.8 节免疫预防后克雷伯菌取代铜绿是同一类现象（本报告推断）。"}],"nodes":["D04-N08","D04-N02"],"offTree":0},{"no":"2.4","title":"“带菌”还是“侵袭”：诊断口径之争（1972–2018，至今两法并存）","notes":[],"nodes":["D04-N07","D04-N13"],"offTree":2},{"no":"2.5","title":"哪些感染真正致死：按菌种、按侵袭分层（1986–2007）","notes":[],"nodes":["D04-N12","D04-N15","D04-N13","D04-R20"],"offTree":2},{"no":"2.6","title":"感染是不是从肠道来：细菌移位与 SDD（1984–2018）","notes":[],"nodes":["D04-N10","D04-N11","D04-N14"],"offTree":2},{"no":"2.7","title":"全身预防性抗生素：从“常规用”到“给谁用”（1982–2026）","notes":[],"nodes":["D04-N09","D04-N17","D04-R12","D04-N14"],"offTree":2},{"no":"2.8","title":"一条结果阳性却没有成为常规的路线：铜绿免疫预防（1983）","notes":[{"k":"认识变化与未解问题","q":"","t":"结果阳性，但本轮找到的来源都没有说明它为什么没有进入标准治疗——原文未说明，本轮未核实。病原替代（克雷伯菌取代铜绿）与 [D04-N08] 中磺胺耐药菌占优是同一类现象（互补，本报告推断）。更早的 Jones、Lowbury 等 1966–1977 年疫苗研究只见题名线索，没有可定位来源（第 8 节）。"}],"nodes":["D04-N19","D04-N08"],"offTree":0},{"no":"2.9","title":"什么算“烧伤脓毒症”：定义之争（2003–2026）","notes":[],"nodes":["D04-N16","D04-E07","D04-R02"],"offTree":1},{"no":"2.10","title":"耐药时代的替代疗法：噬菌体（2014–2026）","notes":[{"k":"新问题","q":"","t":"失败是制剂滴度问题，还是菌株适应和非经典相互作用导致的本质局限？同一试验样本的回溯测序见 4.5 [D04-R16]。"}],"nodes":["D04-N18","D04-R16"],"offTree":0}]},{"id":"D02","name":"焦痂早期切除与自体皮移植","short":"早切与植皮","group":"E2","file":"directions/D02_焦痂早期切除与自体皮移植.md","one":"这个方向研究三件事——烧伤坏死组织（焦痂）什么时候切、怎么切、切完怎样用患者自己的皮盖上；它从 1929–1947 年的个案和病例系列起步，1955–1989 年大面积烧伤中至少四项随机或交替分配试验里，死亡差异只在个别亚组出现，今天\"手术清创加自体植皮\"已被当作新疗法的对照背景（DETECT 2024 摘要），但\"早\"的执行率因国家而异（德国 72 小时内首次手术只占 44%）[D02-R08][D02-R02]。","legend":"图例：实线=原文明确讨论或综述归纳的关系；虚线=本报告推断；边上写关系类型。节点为\"年份 简称\"；Y90 为辅助文献（Yeh 1990 与 Fang 1990 两项大鼠研究，与微粒皮原团队有作者重叠），未单列节点。灰色虚框、标\"（仅题录）\"的 N20、N21 是待读线索节点：只有题录，六要素缺，连线只表示时间上并行，不参与\"谁最早\"\"随机试验先后\"等判断。","notes":"","solidMeans":"原文明确讨论或综述归纳的关系","dashedMeans":"本报告推断","coverage":"基本完整但有标注缺口","turnsHead":"关键转折：问题—新证据/新方法—认识变化—新问题","turns":[{"no":"2.1","title":"旧常规失效，早切从个案变成系列（1929–1947）","notes":[{"k":"认识变化","q":"","t":"焦痂可以不等分离；时间窗和失血这两个后来的核心问题第一次写清。Cope 认为外科医生不愿早切，是因为怕失血、以为游离皮只能长在肉芽上 [D02-N05]。关系：Cope 明确把 Young 列为前人（原文 p.2）；Wells→Cope 只见参考文献表，属本报告推断。"},{"k":"新问题","q":"","t":"大面积烧伤能不能在伤后当天切？切了能不能降低死亡？"}],"nodes":["D02-N04","D02-N02","D02-N05"],"offTree":0},{"no":"2.2","title":"要不要早切：随机试验给出不一致的答案（1955–2006）","notes":[{"k":"认识变化","q":"","t":"早切缩短住院较一致；死亡获益只在亚组出现，且同团队两份报告的解释方向不同。关系：Tompkins→Herndon 为验证（Herndon p.550 称结果\"平行\"）；Jackson 与 Herndon 是适用范围不同的并行试验。"}],"nodes":["D02-N06","D02-N20","D02-N22","D02-N08","D02-N13","D02-N11","D02-N15","D02-N24","D02-N14","D02-N18"],"offTree":1},{"no":"2.3","title":"多早：时间窗、失血与分期切除（1947–1999）","notes":[{"k":"新问题","q":"","t":"24 小时、48 小时、72 小时哪条线真正有意义；\"早\"的获益是否被早切组更多的脓毒症抵消（见 4.1；各来源方向相反，见 5.1\"早切与感染/脓毒症\"）。"}],"nodes":["D02-N05","D02-N25","D02-N17","D02-N26","D02-N14"],"offTree":1},{"no":"2.4","title":"怎么切：保留多少真皮（1970–今）","notes":[],"nodes":["D02-N08","D02-N21","D02-N23","D02-N27","D02-N19"],"offTree":3},{"no":"2.5","title":"切完怎么盖：供区不足的几条路（1954–1993）","notes":[{"k":"新问题","q":"","t":"特大面积时哪种扩展方式成活和瘢痕更好——至今只有小面积随机比较（4.4）。"}],"nodes":["D02-N07","D02-N10","D02-N14","D02-N16","D02-N09","D02-N12"],"offTree":0}]},{"id":"D03","name":"皮肤替代物、组织工程皮肤与细胞治疗","short":"皮肤替代物","group":"E2","file":"directions/D03_皮肤替代物与组织工程皮肤.md","one":"这个方向研究“自体皮不够时，拿什么暂时或永久代替皮肤”，本轮能追到的较早记录是 1938–1942 年把异体皮当作救命性临时覆盖，1975 年后陆续分出培养表皮、真皮模板、活细胞复合皮、细胞悬液、异体细胞产品和基因编辑猪皮等路线，现在处在“多种产品已上市、相互比较的证据薄”的阶段。深Ⅱ度烧伤已有患者内随机试验支持细胞悬液和异体工程皮能少取自体皮 [D03-N15][D03-N16]，而全层大面积烧伤能否因替代物降低死亡，只有非随机和登记库证据 [D03-N22][D03-R12]。**对临床医生最重要的一点**：本章多数关键试验由企业资助、在同一病人的两处创面上对比，能回答“局部愈合、少取皮”，回答不了死亡和住院天数。","legend":"图例：实线=原文明确讨论或综述归纳的关系；虚线=本报告推断或只有摘要泛指、作者重叠等间接依据；边上写关系类型与依据。","notes":"读图要点：图中只有五条实线边有原文或综述支持；其余虚线边是概念相近或作者重叠等间接依据上的推断，不能读成“一条线传下来”。N01→N06 的“中国法”归类有综述依据（[D03-E9]），但把它画成从异体皮覆盖分出来是推断，所以仍用虚线。2026-09-29 第二轮删去两条边：N01→N17（原标“经第三方研究间接关联”，没有找到可回查的第三方研究；BTM 与异体皮时期的比较见 4.2 的 Betar 2023，是历史对照，不据此画边）；N06→N19（只有时间先后与概念相近，见 2.7）。N23 与其他节点没有经核实的直接关系，单独列出。","solidMeans":"原文明确讨论或综述归纳的关系","dashedMeans":"本报告推断或只有摘要泛指、作者重叠等间接依据","coverage":"基本完整但有标注缺口","turnsHead":"关键转折：问题—新证据/新方法—认识变化—新问题","turns":[{"no":"2.1","title":"异体皮能不能留下来：从救命覆盖到“只能临时”（1938–1955）","notes":[{"k":"认识变化","q":"","t":"Gibson & Medawar 1943 在 1 名烧伤病人身上并排种植 52 块自体、50 块兄长的异体点状皮片，15 天后再种 28 块同一供者皮片。第一批异体皮 15 天开始退变、28 天基本完成；第二批第 8 天已大部溶解，并与第一批同时退变；局部没有明显淋巴细胞反应；异体胶原比异体上皮耐久 [D03-N02]。异体皮消失因此被理解为会被“致敏”加速的全身免疫过程。两文关系为互补（本报告推断；Gibson & Medawar 的讨论引用了 Brown 1941 的 M、N 血型观察）。"},{"k":"新问题","q":"","t":"既然只能临时存活，就需要稳定供应。同一作者 1953、1955 年报告尸体异体皮作生物敷料和建立皮库（PMID 13092792、13273143，仅题录）。异体皮传播 HIV 的顾虑在 1987 年已有讨论（Clarke, Lancet 通信，PMID 2882378，仅题录），但本轮没有证据说明它推动了哪条替代物路线。"}],"nodes":["D03-N01","D03-N02"],"offTree":0},{"no":"2.2","title":"从一小块皮扩增出覆盖物：CEA 的起点（1975–1989）","notes":[{"k":"新问题","q":"","t":"培养要等几周；片状 CEA 直接贴在切痂创面上成活不稳、易起疱，因为缺真皮。"}],"nodes":["D03-N03","D03-N04","D03-N07","D03-N20"],"offTree":0},{"no":"2.3","title":"CEA 的弱点与几条并行回应（1986–2000）","notes":[{"k":"新问题","q":"","t":"CEA 能不能救命，至今没有随机证据；2016 年后日本登记库研究给出了新一轮非随机数据（见 4.4）。"}],"nodes":["D03-N08","D03-N13","D03-N12","D03-N15","D03-N10"],"offTree":1},{"no":"2.4","title":"先给真皮：人工真皮、脱细胞真皮到合成模板（1980–2025）","notes":[],"nodes":["D03-N05","D03-N09","D03-N11","D03-N17"],"offTree":1},{"no":"2.5","title":"活细胞复合皮：自体个体化与异体现成两条线（1983–2025）","notes":[],"nodes":["D03-N13","D03-N14","D03-N20","D03-N21","D03-N16"],"offTree":2},{"no":"2.6","title":"不等培养：现场制备的细胞悬液（1952–2026）","notes":[],"nodes":["D03-N15"],"offTree":0},{"no":"2.7","title":"猪皮：从敷料、混合移植到基因编辑活体皮（1955–2025）","notes":[],"nodes":["D03-N06","D03-N01","D03-N18","D03-N19"],"offTree":4},{"no":"2.8","title":"从“覆盖”到“再生”：干细胞与附属器（1987–2024）","notes":[],"nodes":["D03-N12","D03-N23"],"offTree":0}]},{"id":"D06","name":"高代谢反应、营养与代谢调控","short":"代谢营养","group":"E2","file":"directions/D06_高代谢营养与代谢调控.md","one":"这个方向研究大面积烧伤后身体为什么长期“多耗能、拆肌肉”，以及营养和药物能改变多少；它已从 1930–1970 年代“确认现象、争论机制”走到今天“生理终点多有改善、硬结局证据不足”的阶段——普萘洛尔、氧雄龙、生长激素主要在单中心儿童试验里改善了静息能量消耗或瘦体重（氧雄龙另有一项 81 例成人多中心 RCT，报告住院时间缩短 [D06-S33]），而本轮找到的唯一千例级多中心营养试验（成人、肠内谷氨酰胺，1200 例）是阴性 [D06-N16]。**对临床医生最重要的一点**：儿童的高代谢可持续到伤后 2–3 年 [D06-N14]，但支撑多数药物用法的证据集中在同一个单中心平台（Galveston Shriners），其核心注册 NCT00675714（登记入组 1126 人）已终止、登记称研究数据无法访问、没有登记结果（第 7 节）。","legend":"图例：实线=原文明确讨论或综述归纳的关系；虚线=本报告推断；边上写关系类型。节点为“年份 简称”。只到题录的起点线索（Taylor 1943 Science、Abbott 1946、Goodall 1957 等）未画入。","notes":"读图提示：\n- **机制线**（B）不是单线：N18、N19 都在 N03 之前，N20 与多激素输注（Bessey 1984，未画入）是对“单一儿茶酚胺”的补充。\n- **营养线**（C）的方向在 2002 年和 2022 年各被修正一次：多喂不保肌肉（N09），谷氨酰胺单中心阳性被多中心阴性质疑（N16）。\n- **药物线**（D）的 N08、N12、N13 与 E 组的 N14 来自同一机构同一时期，受试者可能重叠，不能当作独立证据相加；N13 原文图 1 明确写出氧雄龙、普萘洛尔、胰岛素等试验从 2000-03 起的同一入组池分流随机。\n- 复审时删去了一条原有的边（Takala 1999 → Jeschke 2011“修正”）：Jeschke 2011 只是在讨论中引用 Takala 说明 rhGH 受限，并没有修正 rhGH 的证据。","solidMeans":"原文明确讨论或综述归纳的关系","dashedMeans":"本报告推断","coverage":"基本完整但有标注缺口","turnsHead":"关键转折：问题—新证据/新方法—认识变化—新问题","turns":[{"no":"2.1","title":"负氮平衡从哪里来：分解、渗出还是吃得少（1930–1953）","notes":[{"k":"新问题","q":"","t":"代谢率为什么升高？"}],"nodes":["D06-N01","D06-N02","D06-N17"],"offTree":2},{"no":"2.2","title":"代谢率为什么升高：几种解释并存，到代谢舱与阻断实验（1953–1990）","notes":[],"nodes":["D06-N17","D06-N18","D06-N19","D06-N03","D06-N20"],"offTree":7},{"no":"2.3","title":"喂多少、喂什么、何时喂（1971–2018）","notes":[],"nodes":["D06-N09","D06-N04","D06-N05"],"offTree":12},{"no":"2.4","title":"合成代谢激素：儿童获益、成人反证、最后撤出市场（1946–2023）","notes":[],"nodes":["D06-N06","D06-N07","D06-N14","D06-N12"],"offTree":11},{"no":"2.5","title":"阻断驱动因素：普萘洛尔（1974–2016）","notes":[],"nodes":["D06-N08"],"offTree":8},{"no":"2.6","title":"血糖：从强化胰岛素到二甲双胍（2001–2016）","notes":[],"nodes":["D06-N13"],"offTree":6},{"no":"2.7","title":"高代谢持续多久（1953–2018）","notes":[],"nodes":["D06-N17","D06-N18","D06-N21","D06-N14","D06-N22"],"offTree":1},{"no":"2.8","title":"额外的热从哪里来：从底物循环到脂肪褐变（1987–2024）","notes":[],"nodes":["D06-N20","D06-N15","D06-N22"],"offTree":2},{"no":"2.9","title":"谷氨酰胺：单中心阳性、多中心阴性（2003–2024）","notes":[],"nodes":["D06-N10","D06-N11","D06-N16"],"offTree":6}]},{"id":"D07","name":"烧伤危重症：死亡风险、器官功能障碍、系统性炎症与救治体系","short":"危重症与救治体系","group":"E2","file":"directions/D07_烧伤危重症与救治体系.md","one":"这个方向研究重度烧伤病人\"会不会死、为什么死、在哪里救\"。本轮能读到原文的最早定量死亡标准是 1949 年伯明翰烧伤单元的 LA50（按年龄×面积算死亡概率），此后死亡评分、跨中心登记库、器官衰竭与系统性炎症机制三条主线并行发展，另有 TBSA 阈值与老年一个分支；现在常用评分的区分度多在 AUC 0.9 以上，研究重心移到校准与本地化、老年与虚弱、器官支持和脓毒症定义、用登记库比较中心，中国线则从 1958 年的个案救治走到两次打击 MODS 研究和本土评分校准。**对临床医生最重要的一点**：修订 Baux 等评分在新人群中常常\"排序准、绝对值不准\"（西南医院 9625 例中四个评分 AUC >0.890 但校准差 [D07-N34]），而且死亡率会被放弃或撤除生命支持的决定改变 [D07-N08]，用评分向家属交代预后或比较中心之前，要先确认它在本地校准过。","legend":"图例：实线=原文明确讨论、同一项目/数据库，或综述归纳的关系；虚线=本报告推断；边上写关系类型。节点写\"年份 简称\"。","notes":"","solidMeans":"原文明确讨论、同一项目/数据库，或综述归纳的关系","dashedMeans":"本报告推断","coverage":"基本完整但有标注缺口","turnsHead":"关键转折：问题—新证据/新方法—认识变化—新问题","turns":[{"no":"2.1","title":"怎样让\"死得多不多\"可以比较：从 LA50 到多变量模型（1949–1986）","notes":[{"k":"新问题","q":"","t":"可比的尺度有了，但查网格表不方便，也没有纳入吸入性损伤。"}],"nodes":["D07-N01","D07-N02","D07-N06"],"offTree":0},{"no":"2.2","title":"床旁能算的评分：从 Baux 到修订 Baux，区分度见顶、校准成了问题（1961–2020）","notes":[{"k":"认识变化","q":"","t":"区分度（能不能把会死的人排在前面）在各评分之间已接近上限，差异主要落在校准，也就是预测的绝对概率在本地准不准，以及年龄两端。"},{"k":"新问题","q":"","t":"机器学习能否更好？Stylianou 2015 在英格兰与威尔士 iBID 人群登记中比较 logistic 回归与 ANN、SVM、随机森林、朴素贝叶斯，差异很少有统计学意义，临床意义也不大（病例队列的样本数摘要未给，全文未取得）[D07-N33]；十年后的 BoBS 称优于传统评分，但只做了内部交叉验证 [D07-R01]。"}],"nodes":["D07-N03","D07-N04","D07-N38","D07-N08","D07-N12","D07-N34","D07-N33","D07-R01"],"offTree":2},{"no":"2.3","title":"从单一单元到登记库：中心之间真有差别吗（1947–2024）","notes":[],"nodes":["D07-N01","D07-N20","D07-N21","D07-N05","D07-N07","D07-R07"],"offTree":0},{"no":"2.4","title":"同等严重度下，生存还在改善吗（1971–2018）","notes":[],"nodes":["D07-N21","D07-N06","D07-N26","D07-N27","D07-N31","D07-N32","D07-N11","D07-N08","D07-N09"],"offTree":0},{"no":"2.5","title":"死因谱变了：从创面感染到器官衰竭，再到\"算感染还是算 MOF\"（1987–2026）","notes":[{"k":"认识变化","q":"","t":"多数研究同意 MOF 是最终通路。分歧在感染占多大比重，而这个分歧有相当部分来自归类标准不同：是否尸检、成人还是儿童、军人还是平民。"}],"nodes":["D07-N23","D07-N26","D07-N09","D07-N29","D07-N30","D07-N28","D07-N35","D07-R14"],"offTree":1},{"no":"2.6","title":"器官衰竭的机制：两次打击、基因组风暴与小鼠之争（1975–2018）","notes":[{"k":"认识变化","q":"","t":"争论从\"像不像\"转到\"用什么口径衡量像不像\"，脓毒症领域随后出了动物研究最低质量共识 MQTiPSS（Osuchowski 2018，PMID 30106875，仅题录）。同一项目还做了血浆蛋白组：32 例（死亡与存活各 16 例）（Finnerty 2013，PMID 23507713，L2）；以及 10 例老年对 20 例配对成人的转录组比较，老年呈低炎症反应（Dreckmann 2019，PMID 31834907，L2）。这些与 Xiao 2011 属同一数据库，不能算独立证据。"},{"k":"新问题","q":"","t":"机制研究在人类样本中能\"描述\"风暴，但至今没有落到有效的抗炎干预上（见第 5 节负性结果）。"}],"nodes":["D07-N22","D07-N24","D07-N25","D07-N10","D07-N09","D07-N13","D07-N15","D07-N16"],"offTree":1},{"no":"2.7","title":"多大面积算\"高危\"：TBSA 阈值与老年（1997–2015）","notes":[],"nodes":["D07-N14","D07-N17","D07-N08","D07-N37","D07-N29","D07-N32","D07-N18"],"offTree":1},{"no":"2.8","title":"器官支持：数据多是观察性，试验多为阴性或做不下去（2001–2023）","notes":[],"nodes":["D07-N37","D07-N36","D07-R15"],"offTree":1}]},{"id":"D09","name":"病理性瘢痕（增生性瘢痕与瘢痕疙瘩）","short":"病理性瘢痕","group":"E3","file":"directions/D09_病理性瘢痕.md","one":"这个方向研究烧伤和手术后为什么有人长出增生性瘢痕或瘢痕疙瘩，以及怎么量、怎么防、怎么治。放疗（1903 年已有学会记录）、激素注射（1950 年代起）、加压（1966 年已有报告）、硅酮（1983）、激光和联合注射先后加入后一直并存，没有哪一种被后来者取代；机制上组织学、TGF-β、机械力、成纤维细胞谱系几种解释也同时在用，现在的重心是单细胞组学、猪模型上的机械转导抑制、注射方案网状 Meta 和早期激光，多数仍停在小样本或动物阶段。**对临床医生最重要的一点**：最常用的压力衣和硅酮，在 Cochrane 系统评价里的证据确定性都是\"极低\"或\"很有限\"（压力衣 15 项研究 1,179 人，全部比较为极低确定性，检索至 2023-06-08；硅酮最新版检索至 2021-12）[D09-E06][D09-E08]；本轮按这两个截止日补查到 2026-09-29，新增的原始 RCT 样本都不大（摘要可见的最大为 153 人）、结果不一致，没有一项比较穿与不穿压力衣（见 4.5），而 TGF-β3 与抗 CTGF 两条药物路线在 II/III 期都没能稳定证明疗效 [D09-N08][D09-N36]。另需注意：烧伤增生性瘢痕线的起点（Larson 1971 压力衣、Linares 1972 组织学）原文未读，这一段依赖综述转述。","legend":"图例：实线=原文明确讨论或综述归纳；虚线=本报告推断（含同组/同一项目但未核原文引用的情形）；边上写关系类型。节点写\"年份 简称\"。AV 为 N08 下的附属证据（avotermin 各期试验）。","notes":"几条边的依据：N05→N03 依据 Finnerty 2016 把愈合时间与压力衣适用对象相连（Deitch 摘要本身没有点名 Larson）；N13→N01 依据 Sclafani 1996 的随机比较；N10→N12 依据 Hultman 2014 与中国 2018 共识的按症状分工；N32→N16 是 Wong 2011 明确使用 Aarabi 的模型。R20 单列，与其他节点无引用关系。","solidMeans":"原文明确讨论或综述归纳","dashedMeans":"本报告推断（含同组/同一项目但未核原文引用的情形）","coverage":"基本完整但有标注缺口","turnsHead":"关键转折：问题—新证据/新方法—认识变化—新问题","turns":[{"no":"2.1","title":"瘢痕疙瘩切了又长：放疗、激素、干扰素、冷冻长期并存（1903–2017）","notes":[{"k":"认识变化","q":"","t":"没有哪种辅助疗法胜出。中国 2018 共识把成人术后放疗列为一线、皮损内 5-FU 列为注射首选 [D09-E05]；中国 2025 儿童指南则把放疗留给常规治疗无效者 [D09-E07]。**新问题**：各方案之间的相对效果和复发控制（见 4.4）。"}],"nodes":["D09-N19","D09-N29","D09-N13","D09-N20","D09-N01","D09-N28","D09-N31","D09-N27","D09-E05","D09-E07"],"offTree":2},{"no":"2.2","title":"烧伤增生性瘢痕：压力衣从\"默认有效\"到\"疗效未证实\"（1966–2024）","notes":[{"k":"认识变化","q":"","t":"压力衣和硅酮仍是标准做法（中国 2018 共识推荐早期联用 [D09-E05]），但证据评级一直很低。**新问题**：确定性大样本 RCT 能否做成。"}],"nodes":["D09-N21","D09-N22","D09-N03","D09-E06","D09-N05","D09-N14","D09-N06","D09-E08","D09-E05"],"offTree":1},{"no":"2.3","title":"怎么量：从 VSS 到 POSAS（1990–2025）","notes":[],"nodes":["D09-N07","D09-N11","D09-E07","D09-R09","D09-N36"],"offTree":0},{"no":"2.4","title":"两种病还是一个谱：组织学、肌成纤维细胞与\"炎症连续谱\"（1951–2021）","notes":[],"nodes":["D09-N04","D09-N02","D09-N23","D09-N09","D09-E04","D09-R01"],"offTree":1},{"no":"2.5","title":"分子靶点：TGF-β3 与抗 CTGF 两条药物路线（1986–2018）","notes":[{"k":"认识变化","q":"","t":"动物有效 → 人体 I/II 期小幅改善 → III 期失败、IIb 疗效不稳定。Tai 2021 称尚无获批的抗瘢痕疗法 [D09-E09]。"}],"nodes":["D09-N25","D09-N08","D09-N35","D09-N36"],"offTree":3},{"no":"2.6","title":"张力：从复发部位统计到机械转导通路（2003–2025）","notes":[{"k":"新问题","q":"","t":"从小鼠松弛皮肤到人。2025 年同组在红色杜洛克猪上验证（见 4.2）[D09-R06]，人体试验尚无；PF573228 未进入临床。"}],"nodes":["D09-N29","D09-N32","D09-N16","D09-N18","D09-R06"],"offTree":0},{"no":"2.7","title":"成纤维细胞不是一种细胞：谱系与单细胞（2015–2026）","notes":[],"nodes":["D09-N17","D09-N18","D09-R01"],"offTree":1},{"no":"2.8","title":"激光：从剥脱切除失败到血管靶向与点阵（1984–2025）","notes":[{"k":"新问题","q":"","t":"什么时候开始打（见 4.3）。"}],"nodes":["D09-N24","D09-N26","D09-N10","D09-N01","D09-N12"],"offTree":1},{"no":"2.9","title":"遗传：从家系到百万级对照（2004–2025）","notes":[],"nodes":["D09-N30","D09-N15","D09-R13"],"offTree":0}]},{"id":"D10","name":"烧伤康复、功能与长期结局","short":"康复与长期结局","group":"E3","file":"directions/D10_烧伤康复功能与长期结局.md","one":"这个方向研究烧伤病人\"活下来之后\"的功能、心理、工作和寿命。它起于 Cocoanut Grove 火灾幸存者的精神科观察（1942 年火灾，1943 年 Ann Surg 系列报告）和更早就有的夹板防挛缩做法，1980 年代起有了烧伤专用量表（1982 年 BSHS），1990 年代起有了美国 Burn Model System 多中心随访库（1994 年设立），2000 年代起陆续有了运动训练的随机试验（此前只有 1987 年 6 例烧伤手的小型随机比较）和出院后死亡的关联数据；国际核心结局集直到 2022 年才定下\"至少要测什么\"，常用量表的结构仍有争议，现在处在\"统一测量口径、检验早期活动/运动/VR\"的阶段。**对临床医生最重要的一点**：出院不等于风险结束——西澳和安大略两个独立的人群匹配研究都显示出院后长期死亡率高于未受伤对照（死亡率比 1.4–1.6；5 年死亡 11% 对 4%）[D10-N12][D10-N14]，而运动和 VR 改善的主要是肌力、肌量和操作时疼痛，多数试验没有看到生活质量获益。","legend":"图例：实线=原文明确讨论或同一数据库/同一事件；虚线=本报告推断；边上写关系类型。节点写\"年份 简称\"。","notes":"","solidMeans":"原文明确讨论或同一数据库/同一事件","dashedMeans":"本报告推断","coverage":"基本完整但有标注缺口","turnsHead":"关键转折：问题—新证据/新方法—认识变化—新问题","turns":[{"no":"2.1","title":"活下来的人心里怎样：从灾难观察到成人长期随访（1943–1972）","notes":[{"k":"新问题","q":"","t":"发生率到底多高？伤前的精神问题算不算烧伤的后果？（见 2.8）"}],"nodes":["D10-N01","D10-N03"],"offTree":0},{"no":"2.2","title":"挛缩怎么防：夹板是老做法，证据一直薄（1866–2012）","notes":[],"nodes":["D10-N18","D10-N02","D10-N10","D10-N31","D10-N24"],"offTree":0},{"no":"2.3","title":"\"活下来之后怎样\"怎么量：从死亡率到专用量表，再到量表结构之争（1979–2022）","notes":[{"k":"认识变化","q":"","t":"测量对象从\"死没死\"到\"烧伤专用健康状态\"，再到\"社会参与\"；常用量表的领域结构在不同样本中不稳定（9 个领域、中国版 6 个领域），总分用法被直接否定。"},{"k":"新问题","q":"","t":"到底该测哪些结局？（见 2.10）"}],"nodes":["D10-N04","D10-N08","D10-N15","D10-R06"],"offTree":0},{"no":"2.4","title":"能不能把功能练回来：运动训练的随机试验（1987–2024）","notes":[{"k":"认识变化","q":"","t":"肌肉和体能终点多数改善；生活质量终点多为阴性；急性期开始训练的两项成人试验都没有看到伤害。"},{"k":"新问题","q":"","t":"12 周以后的功能怎样？生活质量阴性是干预无效，还是所用量表不敏感——现有材料无法区分。"}],"nodes":["D10-N19","D10-N07","D10-N27","D10-R13","D10-N17"],"offTree":2},{"no":"2.5","title":"回得去工作吗：返岗从\"率\"到\"回没回原岗位\"（2001–2025）","notes":[{"k":"认识变化","q":"","t":"\"回到工作\"不等于\"回到原岗位\"。"}],"nodes":["D10-N09","D10-R20","D10-N16","D10-R18"],"offTree":1},{"no":"2.6","title":"从单中心到多中心纵向库：Burn Model System（1994– ）","notes":[],"nodes":["D10-N11","D10-N10","D10-N24","D10-R22","D10-R06","D10-R05"],"offTree":2},{"no":"2.7","title":"出院不是终点：长期死亡与健康（2005–2026）","notes":[{"k":"认识变化","q":"","t":"研究者开始把烧伤当作有长期超额死亡的慢性状态，重点指向伤害预防和精神卫生。"},{"k":"新问题","q":"","t":"可干预的环节在哪里？Little 2026 发现初级保健签约与 5 年死亡没有显著关联 [D10-R02]（见 4.1）。"}],"nodes":["D10-N20","D10-N23","D10-N12","D10-N14","D10-N05"],"offTree":1},{"no":"2.8","title":"精神问题是伤前带来的，还是烧伤造成的（1971–2024）","notes":[{"k":"认识变化","q":"","t":"两说并存。伤前易感是解释烧伤后精神问题的重要部分；烧伤本身也增加一部分风险（急性期谵妄、自伤、大面积者新发诊断）。Andreasen 1971 与 Mason 2017 设计、人群、年代都不同，Mason 未讨论 Andreasen，二者是对照/并行，不是\"后者修正前者\"。"}],"nodes":["D10-N03","D10-N21","D10-N22","D10-N13","D10-R01"],"offTree":2},{"no":"2.9","title":"操作时疼痛：VR 从个案到 Meta，有效成分仍未定（2000–2026）","notes":[],"nodes":["D10-N06","D10-N16"],"offTree":0},{"no":"2.10","title":"统一测什么：核心结局集（2009–2022）","notes":[],"nodes":["D10-N16"],"offTree":2}]},{"id":"D11","name":"整形重建：皮瓣、显微外科与组织扩张（以烧伤与创面修复为主要应用）","short":"皮瓣显微扩张","group":"E3","file":"directions/D11_皮瓣显微外科与组织扩张.md","one":"这个方向研究的是烧伤后的缺损和瘢痕挛缩用什么带血供的组织去补、怎样让它成活、什么时候做；技术库从 19 世纪的局部和远位带蒂皮瓣，经管状皮瓣、轴型与肌皮瓣、显微游离、穿支和皮肤扩张不断扩充，但这些技术大多先在创伤、肿瘤和乳房重建中建立，再移植到烧伤。荷兰三家烧伤中心 1768 例患者随访 10 年，重建最常用的仍是“松解+随意皮瓣/植皮”[D11-N24]，游离皮瓣只用于少数局部办法用尽的病例。**对临床医生最重要的一点**：挛缩修复“皮瓣优于植皮”目前只有两项各约 30 例的随机试验支持（随访 ≤1 年）[D11-N26][D11-N28]；急性期游离皮瓣的时机与电击伤风险仍只有观察性证据：时机结论相互矛盾；两项观察研究都提示电击伤需单独考虑（其中行政数据的电击伤 OR 置信区间为 2.98–550.64，估计极不精确）[D11-N23][D11-N27]。","legend":"图例：实线=原文明确讨论或综述归纳的关系；虚线=本报告推断；边上写关系类型。“回溯归类”指综述用后来的概念给早期工作归类，不表示早期工作影响了后来者。L0/L1 标在节点上。","notes":"","solidMeans":"原文明确讨论或综述归纳的关系","dashedMeans":"本报告推断","coverage":"基本完整但有标注缺口","turnsHead":"关键转折：问题—新证据/新方法—认识变化—新问题","turns":[{"no":"2.0","title":"先校正一个印象：技术谱系不等于烧伤里的实际用量","notes":[],"nodes":["D11-N22","D11-N24","D11-N27","D11-N03","D11-N21","D11-N04","D11-N05","D11-N23","D11-N06","D11-N10","D11-N12","D11-N14","D11-N26","D11-N13","D11-N08","D11-N11","D11-N29","D11-N18","D11-N30","D11-N16","D11-N15"],"offTree":4},{"no":"2.1","title":"烧伤挛缩拿什么盖：局部、远位与管状皮瓣（1842–1945）","notes":[],"nodes":["D11-N19","D11-N01","D11-N20"],"offTree":0},{"no":"2.2","title":"皮瓣为什么能活：从长宽比到血管地图（1967–1987）","notes":[{"k":"认识变化","q":"","t":"分类命名在 McGregor & Morgan 1973 定型，但质疑长宽比（Milton）和使用轴向血管概念（Fujino）都更早，这个转变不能归于单一作者 [D11-N03]。"},{"k":"新问题","q":"","t":"以上都是解剖和通用重建工作。进入烧伤的时点见 2.0 表；angiosome 本轮未找到烧伤专门应用证据。"}],"nodes":["D11-N03","D11-N21","D11-N05","D11-N06","D11-N10"],"offTree":0},{"no":"2.3","title":"能否一次移到远处：再植与游离皮瓣（1962–1978）","notes":[],"nodes":["D11-N02","D11-N04","D11-N07","D11-N21"],"offTree":0},{"no":"2.4","title":"不带肌肉：大腿皮瓣与穿支皮瓣（1984–2006）","notes":[{"k":"新问题","q":"","t":"Wei 2002 以头颈肿瘤重建为主，烧伤未单列。烧伤中的应用见 Stekelenburg 2017 [D11-N26] 和 Chang 2021：薄型胸背动脉穿支游离皮瓣修复 25 例四肢烧伤挛缩，14 例活动度改善，4 例部分坏死（窗口外）[D11-R20]。"}],"nodes":["D11-N09","D11-N12","D11-N10","D11-N14","D11-N26"],"offTree":1},{"no":"2.5","title":"就地旋转：螺旋桨皮瓣（1991–2011）","notes":[],"nodes":["D11-N13"],"offTree":1},{"no":"2.6","title":"让邻近皮肤长出来：扩张术的推广与收缩（1957–2017）","notes":[],"nodes":["D11-N08","D11-N11","D11-N18"],"offTree":1},{"no":"2.7","title":"急性期能不能做游离皮瓣（1975–2021）","notes":[{"k":"认识变化与新问题","q":"","t":"从“急性期高风险、宜推迟”变为“选择性使用”，但时机结论相互矛盾：Baumeister 按伤后天数看失败集中在 5–21 日，Perrault 在行政数据中看不到时机效应。两者的结局定义（皮瓣失败 vs 返回手术室）和数据来源不同，不能直接比较；两者都指向电击伤需要单独考虑（与 D12 交叉）。2021 年后的汇总见 4.1。"}],"nodes":["D11-N22","D11-N23","D11-N27"],"offTree":1},{"no":"2.8","title":"从病例系列到第一批随机比较（2014–2023）","notes":[{"k":"认识变化与新问题","q":"","t":"从“病例系列为主、少量对照试验质量低”变为“两项小 RCT 支持皮瓣优于植皮（面积保持、再挛缩）；在晚期挛缩松解场景中，替代物加植皮的获益未被 RCT 证实（Almeida 2023）”；急性创面的瘢痕证据见 D03 第 2.4 节。两项皮瓣 RCT 合计约 60 例、随访 ≤1 年、结局指标不同，回答不了“哪种皮瓣、哪个部位、多久”。"}],"nodes":["D11-N25","D11-N26","D11-N28"],"offTree":1},{"no":"2.9","title":"边界：再生取向与异体移植（2006–2008）","notes":[],"nodes":["D11-N16","D11-N15","D11-N17"],"offTree":1}]},{"id":"D08","name":"创面愈合生物学与慢性/难愈性创面修复","short":"创面愈合与慢性创面","group":"E4","file":"directions/D08_创面愈合与慢性创面修复.md","one":"这个方向研究“创面靠什么愈合、慢性创面为什么停在不愈、怎样让它闭合”，从 1917–1962 年的敷料环境与湿性愈合实验起步，先后分出生长因子、负压、微环境机制、病因治疗、干细胞与单细胞组学几条线，现阶段处在“按创面类型重新校准”证据的阶段。**对临床医生最重要的一点**：本章临床证据多数来自糖尿病足，局部疗法都是在清创、常规护理等背景治疗之上叠加比较，外推到其他创面要谨慎；负压只在一期缝合切口的感染预防上有中等确定性证据，高压氧的双盲试验结论相反。（具体数字见 0 速读；压力性损伤、放射性溃疡、下肢血运重建本轮未覆盖，见 0 速读第 6 条。）","legend":"图例：实线=原文明确或综述归纳的关系；虚线=本报告推断；边上写关系类型。“叠加”表示在背景治疗之上比较，不是替代。","notes":"N13（MEBO）与湿性愈合线之间没有可靠依据，图中不连线。N21（肌成纤维细胞）与后续节点之间没有核到的关系，也不连线。","solidMeans":"原文明确或综述归纳的关系","dashedMeans":"本报告推断","coverage":"部分","turnsHead":"关键转折：问题—新证据/新方法—认识变化—新问题","turns":[{"no":"2.1","title":"愈合靠什么：敷料环境、白细胞、湿性愈合与细胞生物学（1917–1983）","notes":[{"k":"认识变化","q":"","t":"据 Junker 2013，湿性敷料成为慢性创面的标准做法 [D08-E5]；入口综述把修复描述为炎症、血管新生、基质沉积与细胞募集的过程，成人修复以瘢痕告终、早期胎儿近似再生 [D08-E1][D08-E2]。"},{"k":"新问题","q":"","t":"慢性溃疡为什么在湿润覆盖下仍然不愈？"}],"nodes":["D08-N19","D08-N01","D08-N02","D08-N21","D08-N22","D08-N23"],"offTree":3},{"no":"2.2","title":"缺什么补什么：生长因子路线的起落（1986–2016）","notes":[{"k":"新问题","q":"","t":"外加因子为什么效果有限？是被慢性创面环境降解，还是问题不在“缺因子”？"}],"nodes":["D08-N03","D08-N23","D08-N05","D08-N08","D08-N11","D08-N04","D08-N12"],"offTree":1},{"no":"2.3","title":"慢性创面停在哪里：蛋白酶、生物膜与巨噬细胞（1993–2022）","notes":[],"nodes":["D08-N07","D08-N15","D08-N22","D08-N34","D08-R10"],"offTree":1},{"no":"2.4","title":"病因治疗：减压、加压与静脉手术（1989–2018）","notes":[{"k":"认识变化","q":"","t":"本章收录的生长因子、负压、高压氧和 ON101 试验，对照组是安慰剂或“标准治疗/常规护理”，试验组在同样的背景治疗之上加用受试疗法（据各摘要），检验的是叠加效果（关系：叠加检验，推断）。所以局部疗法的阴性或小效应，不等于慢性创面“没有有效治疗”。"}],"nodes":["D08-N26","D08-N27","D08-N28"],"offTree":0},{"no":"2.5","title":"负压：多源出现、形成现代系统，再按适应证重新检验（1967–2025）","notes":[{"k":"认识变化","q":"","t":"从“负压普遍有益”变成按适应证分开看；Armstrong 2005 与 SWHSI-2 人群都以糖尿病下肢为主、结论不同（推断，设计与终点不同）。"}],"nodes":["D08-N24","D08-N25","D08-N06","D08-N09","D08-N14","D08-N18","D08-N32","D08-R01","D08-R03"],"offTree":3},{"no":"2.6","title":"高压氧：双盲试验结论相反（2010–2018）","notes":[],"nodes":["D08-N23","D08-N29","D08-N30","D08-N31","D08-E7"],"offTree":0},{"no":"2.7","title":"从“闭合”到“再生”：干细胞与皮肤附属器（2001–2021）","notes":[],"nodes":["D08-N16"],"offTree":0},{"no":"2.8","title":"急性烧伤创面上的湿润疗法：MEBO（1988–2020）","notes":[],"nodes":["D08-N13"],"offTree":1}]},{"id":"D12","name":"烧伤流行病学、预防与批量/特殊原因烧伤","short":"流行病学与预防","group":"E4","file":"directions/D12_流行病学预防与批量特殊烧伤.md","one":"这个方向回答三件事——谁在什么情况下被烧伤、能不能在受伤之前拦住、大批伤员同时到来时救治体系接不接得住。它不是一条“从灾难走到全球差距”的单线，而是五条长期并行的线：产品与环境的被动预防（英国 1950 年代取暖器护栏法、美国 1970–90 年代睡衣阻燃和热水器限温）、报警器与安全设备、中低收入国家的家庭能源与炊事烧伤、故意烧伤、灾难与战伤，外加一套负担估计与登记系统；近五年新增证据以 GBD 同源二次分析、医院登记和备灾研究为主，以伤害发生率为结局的对照研究仍很少。","legend":"图例：实线 = 原文明确讨论或综述归纳的关系；虚线 = 本报告推断；边上写关系类型。节点为“年份 简称”。","notes":"","solidMeans":"原文明确讨论或综述归纳的关系","dashedMeans":"本报告推断","coverage":"基本完整但有标注缺口","turnsHead":"关键转折：问题—新证据/新方法—认识变化—新问题","turns":[{"no":"2.1","title":"大批伤员同时到来：从一家医院腾床到跨地区调度（1942–2020）","notes":[],"nodes":["D12-N01","D12-N23","D12-N12","D12-N13","D12-R15"],"offTree":1},{"no":"2.2","title":"伤在家里发生：产品和环境能不能先改（1947–1991，英美两条独立起源）","notes":[{"k":"新问题","q":"","t":"限温管不住故意伤害（Feldman 28%、Erdmann 剩余病例约一半为虐待），这部分归入故意烧伤线（2.6）；存量产品和各州标准不一仍是空档。"}],"nodes":["D12-N02","D12-N17","D12-N03","D12-N26","D12-N04","D12-N05","D12-N06","D12-N21"],"offTree":1},{"no":"2.3","title":"给了设备就等于有保护吗：烟雾报警器的三层证据（1992–2002）","notes":[{"k":"认识变化","q":"","t":"在伦敦贫困多族裔城市社区，**单纯发放没有提高有效安装率，所以没有减少伤害**。这不等于“报警器无效”：Runyan 的观察证据说明家里有能用的报警器与死亡风险低相关；也不能从这一项试验推到所有预防措施。俄克拉荷马城是高发区靶向干预，人群与伦敦不同，两说并存（第 5 节）。"}],"nodes":["D12-N07","D12-N18","D12-N19","D12-N08"],"offTree":0},{"no":"2.4","title":"教育和安全设备能不能降低伤害发生率：证据综合为何说法不一（2009–2025）","notes":[],"nodes":["D12-N20","D12-N22","D12-E7"],"offTree":3},{"no":"2.5","title":"负担在哪里、由谁来数：从单地区人群率到全球模型和登记（1979–2022）","notes":[],"nodes":["D12-N26","D12-E3","D12-E10","D12-E4","D12-N14","D12-N15"],"offTree":2},{"no":"2.6","title":"特殊原因与特殊人群：电、故意、战伤（1986–2025）","notes":[],"nodes":["D12-N09","D12-E9","D12-N10"],"offTree":0}]},{"id":"X01","name":"中国烧伤整形学科的形成与关键事件（横切）","short":"中国学科史","group":"E4","file":"directions/X01_中国烧伤整形学科史.md","one":"这个方向讲中国烧伤整形怎样从 1958 年一次抢救，变成有学会、专刊和科室标准的学科，以及它为什么在 2019 年后把重心转向“烧伤＋创面修复”。现有叙述大多出自当事单位的回忆和述评，中文数据库（CNKI、万方）本轮没有检索，1959–1982 年的中国原始英文报告本轮只查到题录；国外把“中国方案”称为 Chinese method，而同一瑞金团队 1980 年的原文自称它是对西方 Mowlem-Jackson 自异体皮交替移植的改进 [X01-N20]。**对  例、用的是 Elkinton 1940 公式","reading_level":"L4（PMC 扫描页 p.693–697 通读）","verification_status":"修正","pmid":"20783403","doi":"10.1136/bmj.2.4168.693","url":"https://pubmed.ncbi.nlm.nih.gov/20783403/","level_min":"L4","check_source":"独立核查","audited":"否"}]},{"id":"D01-N02","dir":"D01","sub":"D01/S2","y":1947,"yraw":"1947","short":"Cope-Moore 按面积","label":"Cope & Moore：补液量按烧伤面积计算","dlabel":"1947 Cope-Moore 按面积","branch":"公式化","group":"公式化与 Parkland","inTimeline":true,"inDiagram":true,"placedBy":"diagram","ev":[{"row_id":"D01-003","kind":"关键节点","first_author":"Cope O","title":"The Redistribution of Body Water and the Fluid Therapy of the Burned Patient","year":"1947","journal":"Annals of Surgery","volume_pages":"126(6):1010-1045","role":"建立关键方法：补液量按烧伤面积预估（原文自述为 1942 年 NRC 会议建议的修改）","design":"病例系列 + 体液腔测定（染料法血浆量、硫氰酸盐与放射性钠细胞外液、放射性铁红细胞量、渗出液钠氯、每小时尿量）；无同期平行对照；另有犬实验（Cope & Moore 1944）作机制背景","analysis_unit":"患者","n_patients":"19（16 例面积 25%–85%，其中 5 例死亡；另 3 例面积 15%、5%、4%）","outcomes":"细胞外液扩张、血浆量、外部失水、每小时尿量、存活","key_result":"面积公式：普通体型成人每 1%TBSA 首个 24 h 给血浆 75 mL + 不含胶体的等渗电解质液 75 mL，前 8 h 给一半、后 16 h 给一半，第二个 24 h 给第一天的一半，另每 24 h 给 2,000 mL 维持尿量（p.1013–1014）；5 例连续全层烧伤者首 48 h 平均给液 328 mL/%TBSA、血浆 92 mL/%TBSA（p.1017–1018）；面积 ≥30% 者另提“预期组织间隙扩张公式”：创面水肿量 = 体重的 10%，外部丢失按面积分三档，合计的 2/3 给血浆、1/3 给电解质液（p.1036）；细胞外液扩张超过 50% 的 3 例全部死亡，建议以增加 ≤50% 为限（p.1031、1035）；称面积公式最大缺点是没有克制，困难来自过度治疗（p.1035）；每小时尿量 50–200 mL 为足够，30 mL 以下持续 3 h 须加量，超过 200 mL 持续 6 h 为过量（p.1037）。原文脚注：1942-01-07 NRC 会议（Ravdin 主持）首次把面积作为休克治疗的主要依据，Harkins 算出每 10% 面积给血浆 1,000 mL，作者公式是其修改（p.1013）。E5 正文“每 1%TBSA 150 mL、血浆盐水各半、前 8 h 一半”及其表 1 与原文一致","data_source":"麻省总医院（哈佛医学院外科）；19 例，病例号均属 Cocoanut Grove 火灾之后的序列（原文 p.1015 脚注；可见病例号 135–281）；面积公式“依据 1942–43 年治疗大面积烧伤的经验”采用试行（p.1013）。Cocoanut Grove 伤员的处理见 Cope & Rhinelander 1943（每 10%TBSA 24 h 血浆 500 mL，原文 p.916）。综述（E4）称公式基于 Cocoanut Grove 伤员","result_location":"Ann Surg 1947 原文（PMC1803539 扫描页）p.1012–1018、1031、1035–1037、1042–1044；E5 “Choice of fluid” 段第 1 段及表 1；E4 “Fluid resuscitation” 节","limitations":"单中心、19 例、无同期对照；作者说明评价依据主要是实验室测定而非存活（p.1012）；面积按 Berkow 表估算（p.1015），不是综述所说的 Lund-Browder；作者自述面积公式对 >50–60% 面积或体型特殊者可能误导，且未计入部位、深度、吸入伤与体型（p.1035、1042）","reading_level":"L4（PMC 扫描页 p.1010–1045 通读）","verification_status":"修正","pmid":"17859039","doi":"10.1097/00000658-194712000-00013","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC1803539/","level_min":"L4","check_source":"独立核查","audited":"否"}]},{"id":"D01-N03","dir":"D01","sub":"D01/S2","y":1952,"yraw":"1952","short":"Evans 体重×面积","label":"Evans：以“体重×面积”计量（综述称首次）","dlabel":"1952 Evans 体重×面积","branch":"公式化","group":"公式化与 Parkland","inTimeline":true,"inDiagram":true,"placedBy":"diagram","ev":[{"row_id":"D01-004","kind":"关键节点","first_author":"Evans EI","title":"Fluid and electrolyte requirements in severe burns","year":"1952","journal":"Annals of Surgery","volume_pages":"135(6):804-817（PMC 扫描页至 815）","role":"修正：公式加入体重（“体重×面积”计量；综述称首次，原文未自称）","design":"病例系列（公式建立与试用）；以前期病例作非同期比较；无随机","analysis_unit":"患者","n_patients":"68（另 9 例前期病例）","outcomes":"尿量、血红蛋白、肺水肿、死亡","key_result":"按 Cope-Moore 面积公式治疗的 9 例中 4 例早期严重肺水肿、2 例因此死亡（p.804–805）；据 Brooks 犬实验（伤后 6 h 约每 %TBSA 每 kg 丢失 1 mL 血浆）定出：胶体（血浆、血浆代用品或全血）1 + 0.9% 盐水 1 mL/kg/%TBSA + 5% 葡萄糖水 2,000 mL，第二个 24 h 胶体与盐水减半（p.805–806 表 II）；面积 >50% 仍按 50% 计（p.806、808）；尿量目标 25–50 mL/h（p.806、809）；68 例死亡 22 例，≥60% 者 11/11 死亡（p.806 表 III、p.810）；“50 法则”：>50 岁或 >50% 面积须格外谨慎（p.811）。E5 正文（2 mL/kg/%TBSA 血浆与盐水各半 + 2000 mL）、E5 表 1 与 Haberal 2010（第二天减半）均与原文一致。“由此确立 mL/kg/%TBSA 计量单位”为本报告推断","data_source":"弗吉尼亚医学院外科烧伤病房；两年收治 252 例，选出较重的 68 例（原文 p.804）；此前按面积公式治疗的 9 例作前期比较（p.805 表 I）；陆军合同资助","result_location":"Ann Surg 1952 原文（PMC1802193 扫描页）p.804–812、815；E5 正文与表 1；E4 “Fluid resuscitation” 节；Haberal 2010 “Evans formula (1952)” 节","limitations":"单中心、非随机；作者称公式只是指导、不是不可违背的规则（p.809）；原文未自称“首次”，是采纳 Cope & Moore 关于面积公式忽视体重差异的警告（p.804）；更早的 Elkinton 1940 公式已含体重，Cope & Moore 1947 第二公式也按体重 10% 计，故只能写“综述称首次以体重×面积计量”；E4 为此引用的 Moore 文献为 1970 年，年份错位；PubMed 著录页码至 817，PMC 扫描至 815，其余会后讨论页未读","reading_level":"L4（PMC 扫描页 p.804 ole":"提供重要验证/反证：胶体省液但增加肺水；该组测量未见收缩功能抑制","design":"随机对照试验（随机数字表，p.521）：LR vs 2.5% 白蛋白-LR；两组起始估计均为 2 mL/kg/%TBSA，按尿量 30–50 mL/h 调整（p.525）；阶段 1 超声心动图测心功能，阶段 2 重复呼吸法测血管外肺水","analysis_unit":"患者","n_patients":"79（阶段 1 29，阶段 2 50）","outcomes":"液量、心脏指数、射血分数、Vcf、血管外肺水","key_result":"胶体组液量更少（2.98 vs 3.81 mL/kg/%TBSA，p\u003c0.01，p.522 表 1）；阶段 1 两组液量差异不显著（3.12 vs 3.94，p.523）；心脏指数 12–24 h 晶体组较低，48 h 差异消失；阶段 1 的 29 例中射血分数正常、Vcf 超常（p.523–524）；肺水在胶体组 7 天内进行性增加（p\u003c0.0001），晶体组不变（p.524）；阶段 2 胶体组 25 例中 11 例、晶体组 25 例中 3 例后来死亡，作者称例数不足未做统计，但原始死亡数据提示加胶体可能有后期有害作用，结论为晶体“看来是首选”（p.524、528）","data_source":"美国陆军外科研究所（Brooke 陆军医疗中心）单中心；伤后 12 h 内入院、4 h 内开始控制复苏（原文 p.521）","result_location":"Ann Surg 1983 原文（PMC1353023 扫描页）p.520–529；摘要","limitations":"单中心；只纳入无心脏病史、经支气管镜与氙扫描排除吸入伤的年轻成人（p.522、525）；2.5% 白蛋白浓度低（胶体组约 4 g/kg 白蛋白，p.528）；肺水用重复呼吸法；未以死亡为主要结局，死亡差异未做统计；“复苏期无心肌抑制”只基于 29 例的 EF/Vcf；Goodwin 引作心肌抑制因子说来源的是 Baxter & Shires 1968 与 Baxter 1974（参考文献 6、7），会后讨论中 Baxter 称心肌衰竭只见于极大面积或老年伤员（p.529）；后有 Bak 2008、Howard 2013 等相反的小样本证据；会后讨论 p.530–531 PMC 未收","reading_level":"L4（PMC 扫描页 p.520–529 通读；讨论 p.530–531 未收）","verification_status":"通过","pmid":"6342554","doi":"10.1097/00000658-198305000-00004","url":"https://pubmed.ncbi.nlm.nih.gov/6342554/","level_min":"L4","check_source":"独立核查","audited":"否"}]},{"id":"D01-N09","dir":"D01","sub":"D01/S11","y":1986,"yraw":"1986","short":"Merrell 儿童需液多","label":"Merrell：儿童需液量高于成人","dlabel":"1986 Merrell 儿童需液多","branch":"儿童","group":"儿童","inTimeline":true,"inDiagram":true,"placedBy":"diagram","ev":[{"row_id":"D01-012","kind":"关键节点","first_author":"Merrell SW","title":"Fluid resuscitation in thermally injured children","year":"1986","journal":"American Journal of Surgery","volume_pages":"152(6):664-669","role":"明确适用边界：儿童需液量高于成人","design":"回顾性队列，与同期成人协方差分析比较","analysis_unit":"患者","n_patients":"177 名儿童（平均面积 27%；成人对照例数摘要未给）","outcomes":"液量、钠负荷、复苏期死亡、住院死亡、LA50","key_result":"儿童平均液量 5.8±0.25 mL/kg/%TBSA、钠 1.06 mEq/kg/%TBSA，均显著高于成人；复苏期死亡 7%，住院死亡 15%，LA50 64%TBSA；吸入伤使死亡升高（29% vs 7%） "D04-N13","dir":"D04","sub":"D04/B3","y":1987,"yraw":"1987","short":"McManus 培养vs组织学","label":"McManus 培养阳性仅 36% 组织学侵袭","dlabel":"1987 McManus 培养vs组织学","branch":"诊断：带菌还是侵袭","group":"诊断：带菌还是侵袭","inTimeline":true,"inDiagram":true,"placedBy":"diagram","ev":[{"row_id":"D04-013","kind":"关键节点","first_author":"McManus AT","title":"Comparison of quantitative microbiology and histopathology in divided burn-wound biopsy specimens","year":"1987","journal":"Arch Surg","volume_pages":"122(1):74-76","role":"修正既有认识：定量培养阳性不等于侵袭，组织学才是诊断依据","design":"配对标本方法学研究：同一活检一分为二，分别做定量培养（log10 CFU/g）和组织病理评分（1–6 分，≥4 为侵袭存活组织）","analysis_unit":"活检标本（来自患者）","n_patients":"200","outcomes":"定量培养结果与组织学侵袭的一致性","key_result":"培养阴性（\u003c10⁵/g）与组织学无侵袭一致率 96.1%；培养阳性标本只有 36% 组织学确认侵袭","data_source":"单中心烧伤患者活检","result_location":"摘要","limitations":"单中心；组织学评分依赖病理医师；未直接挂钩临床结局；Halstead 2018（26 项研究）认为定量微生物学证据有限；Schofield 2007（PMID 17321689）真菌组织病理与培养一致性差","reading_level":"L2","verification_status":"通过","pmid":"3099730","doi":"10.1001/archsurg.1987.01400130080012","level_min":"L2","check_source":"独立核查","audited":"否"}]},{"id":"D04-N20","dir":"D04","sub":"D04/B1","y":1992,"yraw":"1992","short":"Tredget 水疗暴发","label":"Tredget 水疗设施致铜绿暴发","dlabel":"1992 Tredget 水疗暴发","branch":"病房传播与感染控制","group":"病房传播与感染控制","inTimeline":true,"inDiagram":true,"placedBy":"diagram","ev":[{"row_id":"D04-020","kind":"关键节点","first_author":"Tredget EE","title":"Epidemiology of infections with Pseudomonas aeruginosa in burn patients: the role of hydrotherapy","year":"1992","journal":"Clin Infect Dis","volume_pages":"15(6):941-949","role":"修正常规做法：用分子分型把致死性铜绿暴发追到共用水疗设施","design":"暴发调查（RFLP、菌毛基因探针）+ 停用水疗期间的前后对照（历史对照，单中心）","analysis_unit":"患者/菌株","n_patients":"摘要未给","outcomes":"总死亡、铜绿脓毒症相关死亡、院内铜绿感染、氨基糖苷耐药","key_result":"一株致死性院内铜绿是暴发原因，环境调查提示与共用水疗设施有关；停用水疗期间总死亡率下降，铜绿脓毒症相关死亡消失，氨基糖苷耐药下降","data_source":"单一烧伤中心；环境调查与菌株分子分型","result_location":"摘要","limitations":"历史对照、单中心。后续 Davison 2010（PMID 20305571，L2）：北美 59/142 家中心回复（44%），常规用水疗 95%（1990）→83%，浸浴式 81%→5  Pathology","volume_pages":"23(5):695-720","role":"建立关键方法：人皮肤时间-温度烧伤阈值（本轮找到的最早人皮肤定量阈值研究）","design":"实验研究：主要在猪身上系统测定阈值，再在人皮肤上做少量验证暴露；快速流动热液直接接触皮肤，表面与热源温差 \u003c0.1°C","analysis_unit":"动物/人皮肤暴露部位","n_animals_lab":"动物数与人体暴露数本轮未读到；主要物种为猪（p698）","outcomes":"基底细胞层不可逆损伤、全层表皮坏死","key_result":"44°C 约 6 小时才造成基底细胞层不可逆损伤；≥70°C 不到 1 秒全层表皮坏死；44–51°C 每升 1°C 烧伤速率约翻倍；低于 44°C 速率迅速下降；人与猪阈值相近（按是否出现全层表皮坏死判断）","data_source":"实验室暴露实验；美国科学研究与发展局（OSRD）合同与化学战勤务部资助（p695 脚注）","result_location":"p695（既往小鼠、豚鼠研究与资助脚注）；p696（接触方法）；p698（选猪理由；暴露口径人 7 mm、动物 25 mm）；p712（人皮肤未做显微镜检查）；p718（阈值结论）","limitations":"人皮肤只做少量验证且未做组织学检查；阈值针对成人皮肤，儿童和老人原文未覆盖；背景为战时热损伤；Feldman 1978 是否引用本文未核","reading_level":"L3（p695–699、p712、p718 扫描页）","verification_status":"修正","pmid":"19970955","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC1934304/","level_min":"L3","check_source":"独立核查","audited":"否"}]},{"id":"D12-N17","dir":"D12","sub":"D12/B2","y":1956,"yraw":"1956","short":"Colebrook 取暖器护栏","label":"Colebrook：2000 例住院病例与 1952 年取暖器护栏法（存量仅 1.5% 加装）","dlabel":"1956 Colebrook 取暖器护栏","branch":"被动预防-英国","group":"产品与环境：被动预防","inTimeline":true,"inDiagram":true,"placedBy":"diagram","ev":[{"row_id":"D12-003","kind":"关键节点","first_author":"Colebrook L","title":"The prevention of burning accidents; a survey of the present position","year":"1956","journal":"British Medical Journal","volume_pages":"1(4980):1379-86","role":"提出重要问题并与产品立法同期：英国用住院病例论证家庭取暖器与衣物着火（本轮找到的最早“住院病例＋产品立法”被动预防先例）","design":"住院病例系列总结＋立法实施后随访","analysis_unit":"患者；取暖器（护栏加装）","n_patients":"1951 年报告 2000 例（1949 年报告 1000 例）","n_wounds_flaps_other":"已在使用的无护栏取暖器中约 7.3 万台加装护栏","outcomes":"发生地点、年龄、死亡原因、起火面料、住院床日、护栏覆盖","key_result":"三分之二发生在家中或家附近，50% 为儿童；82% 的死亡来自衣物着火造成的大面积烧伤，受害者主要是妇女和女童，起火面料多为法兰绒类棉布和人造丝；烫伤例数与烧伤相近但死亡少得多；英格兰和威尔士烧烫伤住院约 87.5 万床日/年；Heating Appliances (Fireguards) Act 1952 随 1953-03-24 实施条例于 1954-10-01 生效；存量无护栏取暖器只有约 1.5% 加装护栏","data_source":"伯明翰事故医院 MRC 工业伤害与烧伤研究单元住院病例","result_location":"p1379（前文概括与“Achievement of aims”一节）","limitations":"法案出台是否由本研究推动，只有作者在“目标实现情况”中的表 const mdInline = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '$1');

/* 尺寸按「正常阅读大小」定：缩放为 1 时，1 个单位就是屏幕上 1 像素。gap 是相邻小枝在树冠外沿的间距，maxSpan 是全貌扇面的半角。

const CFG = { R0: 560, r0: 92, maxSpan: 106 * Math.PI / 180, alpha: 0.42, gap: 34, dur: 40, minStep: 13, dirGap: 1.7, groupGap: 3.6 };

const KIND = { '关键节点': { shape: 'circle', prio: 6 }, '近期代表研究': { shape: 'diamond', prio: 4.8 }, '入口综述': { shape: 'square', prio: 4.3 } };

/* ---------- 数据整理 ---------- */
const nodes = D.nodes, byId = new Map(nodes.map(n => [n.id, n]));

  /* 画布上的名字：分支图有这个节点，就用分支图的「年份 简称」原字；否则用时间线的短名，太长的截断 */
  n.yl = n.dlabel ? n.dlabel.slice(0, n.dlabel.length - n.short.length).trim() : String(n.y);

const years = nodes.map(n => n.y);

const polar = (r, th) => [r * Math.sin(th), -r * Math.cos(th)];

/* ---------- 骨架：根 → 四组 → 13 个方向 → 小枝 → 节点 ----------
   棕色的枝只表示归属和年代。每个方向有一根不带节点的主枝，小枝从主枝上分出去；小枝上的节点按年份从里到外排。
   小枝的排法：起步早的排在外侧，起步晚的靠近主枝，左右交替。这样后起的小枝从主枝分出去时，不会横穿先起的小枝 */
const T = new Map();
nodes.forEach((n, i) => { n._i = i; T.set(n.id, { n, id: n.id, r: 0, th: 0, thT: 0, th0: 0, parent: null, children: [], main: null, kind: 'chain', dir: n.dir, sub: n.sub }); });
